<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="heatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="heatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF5722" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Octagon Outer Border -->
  <polygon points="35,8 85,8 112,35 112,85 85,112 35,112 8,85 8,35" fill="url(#heatGrad)" filter="url(#heatGlow)"/>
  <polygon points="37,12 83,12 108,37 108,83 83,108 37,108 12,83 12,37" fill="#1C120C"/>
  <polygon points="40,16 80,16 104,40 104,80 80,104 40,104 16,80 16,40" fill="none" stroke="#FF5722" stroke-width="1.2" stroke-dasharray="3,2"/>
  
  <!-- HeatWave Flame / Wave Icon -->
  <path d="M60 28 C64 35 72 40 70 50 C68 58 58 62 58 62 C58 62 66 57 65 52 C64 48 58 45 58 39 C58 35 60 28 60 28 Z" fill="#FFAB91"/>
  <path d="M54 36 C57 41 62 45 60 52 C58 58 50 62 50 62 C50 62 56 58 55 54 C54 50 50 48 51 43 C52 40 54 36 54 36 Z" fill="#FF5722"/>
  
  <!-- Text -->
  <text x="60" y="74" text-anchor="middle" fill="#FF8A65" font-family="Inter, sans-serif" font-size="7.5" font-weight="900">MYSQL</text>
  <text x="60" y="85" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="8.5" font-weight="800">HEATWAVE</text>
  <text x="60" y="95" text-anchor="middle" fill="#FFAB91" font-family="Inter, sans-serif" font-size="6" font-weight="700">IMPLEMENTATION</text>
  <text x="60" y="103" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="5" font-weight="600">CERTIFIED</text>
</svg>
