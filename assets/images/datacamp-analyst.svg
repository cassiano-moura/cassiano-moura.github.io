<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="dcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05192D"/>
      <stop offset="100%" stop-color="#03EF62"/>
    </linearGradient>
    <filter id="dcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#03EF62" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Rounded Rect -->
  <rect x="10" y="10" width="100" height="100" rx="20" fill="#0A111F" stroke="#03EF62" stroke-width="2" filter="url(#dcGlow)"/>
  <rect x="15" y="15" width="90" height="90" rx="16" fill="#070C16"/>
  
  <!-- Analytics Chart Bars -->
  <rect x="36" y="48" width="8" height="18" rx="2" fill="#03EF62"/>
  <rect x="48" y="38" width="8" height="28" rx="2" fill="#38BDF8"/>
  <rect x="60" y="32" width="8" height="34" rx="2" fill="#03EF62"/>
  <rect x="72" y="42" width="8" height="24" rx="2" fill="#A855F7"/>
  
  <!-- Text -->
  <text x="60" y="78" text-anchor="middle" fill="#03EF62" font-family="Inter, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.5">ASSOCIATE</text>
  <text x="60" y="88" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="8" font-weight="800">DATA ANALYST</text>
  <text x="60" y="97" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="5.5" font-weight="600">DATACAMP &amp; SQL</text>
