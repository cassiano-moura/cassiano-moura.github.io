<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="msGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#002050"/>
    </linearGradient>
    <linearGradient id="msShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#50E6FF"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>
    <filter id="msGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0078D4" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Circle Outer -->
  <circle cx="60" cy="60" r="54" fill="url(#msGrad)" filter="url(#msGlow)" stroke="#50E6FF" stroke-width="2"/>
  <circle cx="60" cy="60" r="48" fill="#0D1526"/>
  <circle cx="60" cy="60" r="45" fill="none" stroke="#0078D4" stroke-width="1.5" stroke-dasharray="2,2"/>
  
  <!-- Security Shield Icon -->
  <path d="M60 28 L78 35 C78 52 68 64 60 70 C52 64 42 52 42 35 Z" fill="url(#msShield)"/>
  <!-- Keyhole in shield -->
  <circle cx="60" cy="46" r="3.5" fill="#0D1526"/>
  <polygon points="58,47 62,47 63,55 57,55" fill="#0D1526"/>
  
  <!-- Text -->
  <text x="60" y="82" text-anchor="middle" fill="#50E6FF" font-family="Inter, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.5">MICROSOFT</text>
  <text x="60" y="93" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="8.5" font-weight="800">SC-900</text>
  <text x="60" y="102" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="5.5" font-weight="600">SECURITY &amp; IDENTITY</text>
</svg>
