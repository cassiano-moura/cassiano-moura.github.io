<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="msAiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A4EF"/>
      <stop offset="50%" stop-color="#7FBA00"/>
      <stop offset="100%" stop-color="#F25022"/>
    </linearGradient>
    <filter id="msAiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00A4EF" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Outer circle -->
  <circle cx="60" cy="60" r="54" fill="#0A1120" filter="url(#msAiGlow)" stroke="#00A4EF" stroke-width="2"/>
  <circle cx="60" cy="60" r="48" fill="#0D1526"/>
  <circle cx="60" cy="60" r="45" fill="none" stroke="url(#msAiGrad)" stroke-width="1.5" stroke-dasharray="2,2"/>
  
  <!-- Microsoft 4 square mini logo -->
  <rect x="47" y="32" width="11" height="11" fill="#F25022" rx="1.5"/>
  <rect x="62" y="32" width="11" height="11" fill="#7FBA00" rx="1.5"/>
  <rect x="47" y="47" width="11" height="11" fill="#00A4EF" rx="1.5"/>
  <rect x="62" y="47" width="11" height="11" fill="#FFB900" rx="1.5"/>
  
  <!-- AI Sparkle in center -->
  <circle cx="60" cy="45" r="3" fill="#FFFFFF"/>

  <!-- Text -->
  <text x="60" y="78" text-anchor="middle" fill="#00A4EF" font-family="Inter, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.5">MICROSOFT</text>
  <text x="60" y="89" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="8" font-weight="800">GENERATIVE AI</text>
  <text x="60" y="99" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="5.5" font-weight="600">PRODUCTIVITY SKILLS</text>
</svg>
