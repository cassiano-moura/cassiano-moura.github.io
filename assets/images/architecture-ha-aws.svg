<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="vpcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.05)"/>
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.02)"/>
    </linearGradient>
    <linearGradient id="albGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="ec2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="rdsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadowGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="540" rx="14" fill="url(#bgCanvas)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Region Boundary -->
  <rect x="25" y="25" width="870" height="490" rx="12" fill="none" stroke="#334155" stroke-dasharray="6,4" stroke-width="1.2"/>
  <text x="45" y="48" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" font-weight="700">AWS REGION (us-east-1)</text>

  <!-- VPC Boundary -->
  <rect x="45" y="65" width="830" height="430" rx="10" fill="url(#vpcGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="65" y="88" fill="#38BDF8" font-family="Inter, sans-serif" font-size="13" font-weight="800">CUSTOM VPC (10.0.0.0/16)</text>
  
  <!-- Internet Gateway -->
  <rect x="410" y="32" width="100" height="28" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="460" y="50" text-anchor="middle" fill="#38BDF8" font-family="Inter, sans-serif" font-size="10.5" font-weight="700">Internet Gateway</text>

  <!-- AZ 1 Boundary -->
  <rect x="70" y="105" width="380" height="370" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#475569" stroke-dasharray="4,4"/>
  <text x="90" y="125" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11" font-weight="700">Availability Zone: us-east-1a</text>

  <!-- AZ 2 Boundary -->
  <rect x="470" y="105" width="380" height="370" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#475569" stroke-dasharray="4,4"/>
  <text x="490" y="125" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11" font-weight="700">Availability Zone: us-east-1b</text>

  <!-- TIER 1: PUBLIC SUBNETS (ALB & NAT) -->
  <rect x="85" y="140" width="350" height="75" rx="6" fill="rgba(56, 189, 248, 0.08)" stroke="#0284C7" stroke-width="1"/>
  <text x="95" y="156" fill="#38BDF8" font-family="Inter, sans-serif" font-size="10" font-weight="700">Public Subnet A (10.0.1.0/24)</text>

  <rect x="485" y="140" width="350" height="75" rx="6" fill="rgba(56, 189, 248, 0.08)" stroke="#0284C7" stroke-width="1"/>
  <text x="495" y="156" fill="#38BDF8" font-family="Inter, sans-serif" font-size="10" font-weight="700">Public Subnet B (10.0.2.0/24)</text>

  <!-- ALB Spanning Public Subnets -->
  <rect x="330" y="152" width="260" height="48" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2" filter="url(#shadowGlow)"/>
  <text x="460" y="174" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="800">Application Load Balancer</text>
  <text x="460" y="190" text-anchor="middle" fill="#38BDF8" font-family="Inter, sans-serif" font-size="9.5" font-weight="600">Port 80 / 443 • Health Check (/) • SG: alb-sg</text>

  <!-- TIER 2: PRIVATE APP SUBNETS (AUTO SCALING EC2) -->
  <rect x="85" y="235" width="350" height="115" rx="6" fill="rgba(255, 153, 0, 0.08)" stroke="#D97706" stroke-width="1"/>
  <text x="95" y="252" fill="#FF9900" font-family="Inter, sans-serif" font-size="10" font-weight="700">Private App Subnet A (10.0.11.0/24)</text>

  <rect x="485" y="235" width="350" height="115" rx="6" fill="rgba(255, 153, 0, 0.08)" stroke="#D97706" stroke-width="1"/>
  <text x="495" y="252" fill="#FF9900" font-family="Inter, sans-serif" font-size="10" font-weight="700">Private App Subnet B (10.0.12.0/24)</text>

  <!-- EC2 Nodes -->
  <rect x="150" y="265" width="220" height="68" rx="8" fill="#182030" stroke="#FF9900" stroke-width="1.5" filter="url(#shadowGlow)"/>
  <text x="260" y="288" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11.5" font-weight="700">EC2 Instance (AZ-a)</text>
  <text x="260" y="304" text-anchor="middle" fill="#FF9900" font-family="Inter, sans-serif" font-size="9.5">Nginx + Health API • t3.micro</text>
  <text x="260" y="320" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="8.5">SG: app-sg (ALB ingress only)</text>

  <rect x="550" y="265" width="220" height="68" rx="8" fill="#182030" stroke="#FF9900" stroke-width="1.5" filter="url(#shadowGlow)"/>
  <text x="660" y="288" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11.5" font-weight="700">EC2 Instance (AZ-b)</text>
  <text x="660" y="304" text-anchor="middle" fill="#FF9900" font-family="Inter, sans-serif" font-size="9.5">Nginx + Health API • t3.micro</text>
  <text x="660" y="320" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="8.5">Auto Scaling Group (Min:2, Max:4)</text>

  <!-- TIER 3: PRIVATE DATABASE SUBNETS (MULTI-AZ RDS) -->
  <rect x="85" y="370" width="350" height="90" rx="6" fill="rgba(59, 130, 246, 0.08)" stroke="#2563EB" stroke-width="1"/>
  <text x="95" y="386" fill="#60A5FA" font-family="Inter, sans-serif" font-size="10" font-weight="700">Private DB Subnet A (10.0.21.0/24)</text>

  <rect x="485" y="370" width="350" height="90" rx="6" fill="rgba(59, 130, 246, 0.08)" stroke="#2563EB" stroke-width="1"/>
  <text x="495" y="386" fill="#60A5FA" font-family="Inter, sans-serif" font-size="10" font-weight="700">Private DB Subnet B (10.0.22.0/24)</text>

  <!-- RDS Instances -->
  <rect x="170" y="400" width="180" height="48" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="260" y="420" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="700">Amazon RDS MySQL</text>
  <text x="260" y="436" text-anchor="middle" fill="#38BDF8" font-family="Inter, sans-serif" font-size="9">Primary (Port 3306)</text>

  <rect x="570" y="400" width="180" height="48" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="660" y="420" text-anchor="middle" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11" font-weight="700">Amazon RDS MySQL</text>
  <text x="660" y="436" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="9">Standby Multi-AZ (Failover)</text>

  <!-- Replication Line between RDS -->
  <path d="M350 424 L570 424" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="460" y="418" text-anchor="middle" fill="#93C5FD" font-family="Inter, sans-serif" font-size="8.5">Sync Replication</text>

  <!-- Traffic Connection Lines -->
  <!-- IGW to ALB -->
  <path d="M460 60 L460 152" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- ALB to EC2 AZ-a -->
  <path d="M410 200 L260 265" stroke="#FF9900" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- ALB to EC2 AZ-b -->
  <path d="M510 200 L660 265" stroke="#FF9900" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- EC2 to RDS -->
  <path d="M260 333 L260 400" stroke="#3B82F6" stroke-width="1.5"/>
  <path d="M660 333 L290 400" stroke="#3B82F6" stroke-width="1" stroke-dasharray="2,2"/>

</svg>
