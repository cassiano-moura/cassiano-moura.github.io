<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="oracleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F80000"/>
      <stop offset="100%" stop-color="#7A0000"/>
    </linearGradient>
    <filter id="oracleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#F80000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Diamond Shape Outer -->
  <polygon points="60,6 114,60 60,114 6,60" fill="url(#oracleGrad)" filter="url(#oracleGlow)" stroke="#FF6B6B" stroke-width="2"/>
  <polygon points="60,12 108,60 60,108 12,60" fill="#1A0D0D"/>
  <polygon points="60,16 104,60 60,104 16,60" fill="none" stroke="#F80000" stroke-width="1.2" stroke-dasharray="3,2"/>
  
  <!-- Oracle Database Icon / Cylinders -->
  <ellipse cx="60" cy="38" rx="16" ry="5" fill="#F80000"/>
  <path d="M44 38 v7 c0 3 7 5 16 5 s16 -2 16 -5 v-7 Z" fill="#FF4D4D"/>
  <path d="M44 47 v7 c0 3 7 5 16 5 s16 -2 16 -5 v-7 Z" fill="#F80000"/>
  
  <!-- Text -->
  <text x="60" y="70" text-anchor="middle" fill="#FF8080" font-family="Inter, sans-serif" font-size="7.5" font-weight="900" letter-spacing="1">ORACLE</text>
  <text x="60" y="80" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="7.5" font-weight="800">DATA PLATFORM</text>
  <text x="60" y="89" text-anchor="middle" fill="#FF8080" font-family="Inter, sans-serif" font-size="6" font-weight="700">FOUNDATIONS</text>
  <text x="60" y="97" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="5" font-weight="600">ASSOCIATE</text>
</svg>
